# Rebuilds the static blog (post pages, posts.json, sitemap, RSS) from content/posts/*.md
# on every push to main and commits the result, so a forgotten local build never hides a post.
name: Build blog

on:
  push:
    branches: [main]
    paths:
      - 'content/**'
      - 'scripts/build-blog.mjs'
      - 'js/md.js'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-blog
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/build-blog.mjs
      - name: Commit generated files
        run: |
          git add -A blog sitemap.xml rss.xml robots.txt
          if git diff --cached --quiet; then
            echo "Generated files already up to date."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
            git commit -m "Rebuild blog"
            git push
          fi
